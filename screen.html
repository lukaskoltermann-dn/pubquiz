<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kolties QuizKasten · Beamer</title>
<script>/* Update-Check: lädt neu, sobald eine neuere Version online ist */const APPV="20261127l";fetch("version.txt?"+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.text():"").then(t=>{t=t.trim();if(t&&t!==APPV){const u=new URL(location.href);if(u.searchParams.get("v")!==t){u.searchParams.set("v",t);location.replace(u)}}}).catch(()=>{});</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css?v=20261127l">
<style>
html,body{height:100%;overflow:hidden}
/* Feste Full-HD-Bühne, die auf jede Bildschirmgröße skaliert wird */
#stage{position:fixed;left:50%;top:50%;width:1920px;height:1080px;transform:translate(-50%,-50%) scale(var(--k,1));transform-origin:center}
.logo.big .l1{font-size:30px}.logo.big .l2{font-size:96px}.logo .l1{font-size:16px}.logo .l2{font-size:40px}
#s{height:100%;display:flex;flex-direction:column;padding:48px 115px 0;gap:28px;position:relative;overflow:hidden}
.hd{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.rn{font-size:30px;color:var(--muted);font-weight:600}
.qr{background:#fff;padding:12px;border-radius:16px;line-height:0;box-shadow:0 0 0 4px var(--gold),0 0 30px rgba(255,170,40,.5)}
.qr svg{width:100%;height:auto;display:block}
.lobby{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:50px;align-items:end;flex:1}
.lobby .join{display:grid;grid-template-columns:auto minmax(0,1fr);gap:40px;align-items:center;align-self:center}
.lobby .qr{width:360px}
.code{font:400 110px/1 Bungee,sans-serif;letter-spacing:.06em;color:var(--gold);text-shadow:0 0 24px rgba(255,170,40,.55)}
.url{font-size:22px;color:var(--muted);overflow-wrap:anywhere}
.names{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.names span{background:rgba(255,255,255,.1);border:1px solid var(--line);border-radius:999px;padding:6px 16px;font-size:22px;font-weight:600;animation:pop .5s ease-out}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.stage{align-self:stretch;display:flex;align-items:flex-end;justify-content:center}
.stage img{max-height:760px;width:auto}
.q{flex:1;display:flex;flex-direction:column;justify-content:center;gap:30px;max-width:1500px;padding-bottom:48px}
.q .lab{font:400 30px/1 Bungee,sans-serif;color:var(--gold)}
.q .txt{font-size:66px;line-height:1.15;font-weight:600;text-wrap:balance}
.q .op{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.q .op div{background:rgba(12,24,68,.85);border:2px solid rgba(255,194,58,.5);border-radius:18px;padding:22px;font-size:36px;font-weight:500}
.q .op b{font-family:Bungee,sans-serif;font-weight:400;color:var(--gold);margin-right:12px}
.tm{font:400 170px/1 Bungee,sans-serif;color:var(--gold);text-shadow:0 0 30px rgba(255,170,40,.6);font-variant-numeric:tabular-nums}
.mini{width:150px}
.onair{flex:1;padding-bottom:48px;display:grid;justify-items:center;align-content:center;gap:24px;text-align:center}
.onair .lab{font:400 46px/1 Bungee,sans-serif;color:var(--gold)}
.ring{position:relative;width:340px;aspect-ratio:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.ring circle{fill:none;stroke-width:10}
.ring .bg{stroke:rgba(255,255,255,.12)}
.ring .fg{stroke:var(--gold);stroke-linecap:round}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font:400 150px/1 Bungee,sans-serif;color:#fff;text-shadow:0 0 24px rgba(255,170,40,.7)}
.eq{display:flex;align-items:flex-end;gap:9px;height:108px}
.eq i{display:block;width:16px;height:100%;border-radius:6px 6px 2px 2px;background:linear-gradient(0deg,#ff8a00,#ffd45a 60%,#fff6c8);transform-origin:bottom;animation:eq .8s ease-in-out infinite alternate;box-shadow:0 0 12px rgba(255,170,40,.5)}
@keyframes eq{0%{transform:scaleY(.12)}50%{transform:scaleY(.85)}100%{transform:scaleY(.35)}}
@media(prefers-reduced-motion:reduce){.eq i{animation:none;transform:scaleY(.5)}}
.corner{position:absolute;right:38px;bottom:0;height:420px;pointer-events:none}
#s ol{list-style:none;margin:0;padding:0;display:grid;gap:14px;max-width:1300px;width:100%}
#s li{display:grid;grid-template-columns:110px minmax(0,1fr) auto;align-items:center;gap:20px;background:rgba(12,24,68,.85);border:1px solid var(--line);border-radius:18px;padding:16px 28px;font-size:42px;transition:opacity .7s,transform .7s}
#s li.first{background:linear-gradient(180deg,#ffd45a,#ff9a10);color:var(--goldink);border-color:#ffe08a;box-shadow:0 0 40px rgba(255,170,40,.6)}
#s li.hid{opacity:0;transform:translateY(24px) scale(.97)}
#s li .nm{font-weight:700;overflow-wrap:anywhere}
.withpic{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:50px;align-items:end;flex:1}
.withpic>ol,.withpic>.q{padding-bottom:48px}.lobby>.stack{padding-bottom:48px}
#s>.fitme{transform-origin:top left}
.withpic img{max-height:640px;width:auto}
.withpic ol{align-self:center}
/* Antwortzeit: Abgabe-Zähler, letzte 10 Sekunden */
.got{display:grid;gap:10px}
.dots{display:flex;flex-wrap:wrap;gap:10px}
.dots i{width:30px;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.25);transition:background .4s,box-shadow .4s}
.dots i.on{background:var(--ok);border-color:#b8ffd6;box-shadow:0 0 16px rgba(97,229,154,.7);animation:pop .4s ease-out}
.got b{color:var(--ink)}
.q.last10 .tm{font-size:324px;color:#fff;text-shadow:0 0 40px rgba(255,79,79,.9),0 0 10px #ff4f4f;animation:beat 1s ease-out infinite}
.q.last10 .lab{color:var(--red)}
.q.over .tm{color:var(--red);font-size:150px}
@keyframes beat{0%{transform:scale(1.18)}35%{transform:scale(1)}}
#aq{align-items:center;text-align:center;margin:0 auto}
#aq .dots{justify-content:center}
.q.solve{gap:17px}
.q.solve .qt{gap:17px}
.q.solve .txt{font-size:54px}
.q.solve .op div{padding:15px 22px}
.q.solve .qimg{max-height:626px}
/* Frage mit Bild */
.q.hasimg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:50px;align-items:center;max-width:none}
.q .qt{display:grid;gap:30px}
.q .qimg{max-width:100%;max-height:713px;justify-self:center;border-radius:20px;box-shadow:0 0 0 4px rgba(255,194,58,.6),0 20px 50px rgba(0,0,0,.5);background:#000}
.q.hasimg .op{grid-template-columns:minmax(0,1fr)}
/* Auflösung */
.op.sol div{position:relative;overflow:hidden;display:flex;align-items:center;gap:0;transition:opacity .6s,border-color .6s,box-shadow .6s}
.op.sol .bar{position:absolute;inset:0 auto 0 0;width:var(--w);background:rgba(255,255,255,.1);transition:width 1.2s cubic-bezier(.2,.8,.2,1) .2s;z-index:0}
.op.sol .ot,.op.sol b,.op.sol .cnt{position:relative;z-index:1}
.op.sol .ot{flex:1}
.op.sol .cnt{font:400 38px/1 Bungee,sans-serif;margin-left:12px}
.op.sol .right{border-color:var(--ok);box-shadow:0 0 0 3px var(--ok),0 0 40px rgba(97,229,154,.55);background:rgba(20,80,50,.9)}
.op.sol .right .bar{background:rgba(97,229,154,.35)}
.op.sol .wrong{opacity:.55}
.big-ans{font:400 90px/1.1 Bungee,sans-serif;color:var(--ok);text-shadow:0 0 30px rgba(97,229,154,.5);animation:pop .6s cubic-bezier(.2,1.4,.4,1)}
.stats{display:grid;gap:12px;max-width:900px}
.stats div{display:grid;grid-template-columns:170px minmax(0,1fr) auto;gap:16px;align-items:center;font-size:30px;font-weight:600}
.meter{height:22px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden}
.meter i{display:block;height:100%;width:var(--w);border-radius:999px;background:linear-gradient(90deg,#ff8a00,#ffd45a);transition:width 1.2s cubic-bezier(.2,.8,.2,1) .3s}
.pre.bar,.meter i.pre{width:0!important}
/* Zahlenstrahl der Schätzfrage */
.nl{position:relative;height:340px;margin:0 90px}
.nl .axis{position:absolute;left:-30px;right:-30px;top:50%;height:6px;border-radius:3px;background:linear-gradient(90deg,rgba(255,255,255,.2),rgba(255,255,255,.6),rgba(255,255,255,.2))}
.pin{position:absolute;top:50%;width:0;transition:left 1s cubic-bezier(.2,.8,.2,1),opacity .5s,transform .6s cubic-bezier(.2,1.4,.4,1)}
.pin::before{content:"";position:absolute;left:-10px;top:-10px;width:20px;height:20px;border-radius:50%;background:var(--blue);border:3px solid #fff;box-shadow:0 0 14px rgba(61,123,255,.8)}
.pin span{position:absolute;left:0;transform:translateX(-50%);white-space:nowrap;text-align:center;font-weight:700;font-size:22px}
.pin .pv{font-family:Bungee,sans-serif;font-weight:400;color:var(--gold)}
.pin.upr .pn{bottom:44px}.pin.upr .pv{bottom:16px}
.pin.dn .pn{top:44px}.pin.dn .pv{top:16px}
.pin.best::before{background:var(--gold);box-shadow:0 0 24px rgba(255,194,58,.95);transform:scale(1.4)}
.pin.best .pn{color:var(--gold)}
.pin.pre{opacity:0;transform:translateY(-60px)}
.truth{position:absolute;top:4%;bottom:4%;width:0;border-left:5px solid var(--ok);box-shadow:0 0 24px rgba(97,229,154,.9);transition:transform .8s cubic-bezier(.2,1.4,.4,1) .3s,opacity .4s .3s;transform-origin:center}
.truth span{position:absolute;top:-1.4em;left:0;transform:translateX(-50%);white-space:nowrap;font:400 32px/1 Bungee,sans-serif;color:var(--ok)}
.truth.pre{transform:scaleY(0);opacity:0}
/* Rangliste: Pfeile, Joker, Trommelwirbel */
.mv{display:inline-block;margin-left:14px;font:400 .62em/1 Bungee,sans-serif;padding:.25em .5em;border-radius:999px;vertical-align:middle;animation:pop .5s cubic-bezier(.2,1.4,.4,1) 2.4s both}
.mv.up{background:rgba(97,229,154,.2);color:var(--ok)}
.mv.down{background:rgba(255,79,79,.2);color:#ff8a7a}
#s li.first .mv{background:rgba(43,19,0,.15);color:var(--goldink)}
.jk{font-size:.7em;margin-left:10px;vertical-align:middle}
#rk.anim li{position:relative;z-index:1}
.drumov{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;background:rgba(3,7,24,.78);z-index:20;text-align:center}
.drumov div{font-size:194px;animation:shake .12s linear infinite}
.drumov p{font:400 80px/1.1 Bungee,sans-serif;color:var(--gold);text-shadow:0 0 30px rgba(255,170,40,.7);margin:10px 0 0}
@keyframes shake{0%{transform:rotate(-6deg)}50%{transform:rotate(6deg) translateY(-6px)}100%{transform:rotate(-6deg)}}
</style>
</head>
<body>
<div id="stage"><div id="s"><p>Wird geladen…</p></div></div>
<script>const fit=()=>document.documentElement.style.setProperty("--k",Math.min(innerWidth/1920,innerHeight/1080));fit();addEventListener("resize",fit);</script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script type="module" src="js/screen.js?v=20261127l"></script>
</body>
</html>
