<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pubquiz Beamer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
<style>
html,body{height:100%}
body{background:#7d1c18;color:#fff}
#s{min-height:100%;display:flex;flex-direction:column;padding:clamp(16px,3.5vw,56px);gap:clamp(12px,2vw,28px)}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap}
.hd h1{font-size:clamp(28px,4.5vw,64px)}
.rn{font-size:clamp(18px,2vw,28px);color:#ffffffc0;margin-top:6px}
.qr{background:#fff;padding:12px;border-radius:16px;line-height:0}
.qr svg{width:100%;height:auto;display:block}
.lobby{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:clamp(20px,4vw,60px);align-items:center;flex:1}
.lobby .qr{width:clamp(220px,28vw,420px)}
.code{font-size:clamp(48px,8vw,120px);letter-spacing:.08em;line-height:1}
.url{font-size:clamp(16px,1.8vw,26px);color:#ffffffd0;overflow-wrap:anywhere}
.names{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.names span{background:#ffffff1f;border-radius:999px;padding:6px 16px;font-size:clamp(16px,1.6vw,24px);font-weight:600}
.q{flex:1;display:flex;flex-direction:column;justify-content:center;gap:clamp(14px,2vw,30px)}
.q .lab{font-size:clamp(18px,2vw,30px);color:var(--gold);font-weight:700}
.q .txt{font-size:clamp(28px,4.2vw,68px);line-height:1.15;text-wrap:balance}
.q .op{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(8px,1.2vw,18px)}
.q .op div{background:#ffffff17;border-radius:16px;padding:clamp(10px,1.4vw,22px);font-size:clamp(18px,2.4vw,38px)}
.q .op b{color:var(--gold);margin-right:10px}
.tm{font-size:clamp(40px,7vw,110px);font-variant-numeric:tabular-nums;line-height:1}
.mini{width:clamp(90px,9vw,150px)}
#s ol{list-style:none;margin:0;padding:0;display:grid;gap:clamp(6px,1vw,14px)}
#s li{display:grid;grid-template-columns:clamp(48px,7vw,110px) minmax(0,1fr) auto;align-items:center;gap:20px;background:#ffffff14;border-radius:16px;padding:clamp(8px,1.2vw,18px) clamp(12px,2vw,28px);font-size:clamp(20px,3vw,44px);transition:opacity .6s,transform .6s}
#s li.first{background:var(--gold);color:var(--goldink)}
#s li.hid{opacity:0;transform:translateY(20px)}
@media(max-width:700px){.lobby{grid-template-columns:minmax(0,1fr)}.q .op{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<div id="s"><p>Wird geladen…</p></div>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script type="module" src="js/screen.js"></script>
</body>
</html>
