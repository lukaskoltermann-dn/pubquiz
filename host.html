<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kolties QuizKasten · Moderation</title>
<script>/* Update-Check: lädt neu, sobald eine neuere Version online ist */const APPV="20261127i";fetch("version.txt?"+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.text():"").then(t=>{t=t.trim();if(t&&t!==APPV){const u=new URL(location.href);if(u.searchParams.get("v")!==t){u.searchParams.set("v",t);location.replace(u)}}}).catch(()=>{});</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css?v=20261127i">
<style>
.item{display:grid;gap:8px}
.item .row2>label{flex:1 1 160px}
.script{border-left:4px solid var(--gold);padding:10px 12px;background:rgba(3,8,28,.55);border-radius:0 12px 12px 0}
.script.done{border-left-color:var(--line);opacity:.7}
.script .right{font-weight:600;color:var(--ok)}
#spotbox{position:fixed;right:16px;bottom:16px;width:min(360px,calc(100vw - 32px));background:var(--paper);border:1px solid var(--gold);border-radius:16px;padding:10px 12px;z-index:40;box-shadow:0 10px 40px rgba(0,0,0,.5);display:grid;gap:6px}
#spframe{min-height:80px;border-radius:12px;overflow:hidden}
.qrbox{background:#fff;padding:10px;border-radius:12px;display:inline-block;line-height:0}
.code{font-size:clamp(34px,5vw,52px);letter-spacing:.06em;color:var(--gold)}
.ans{color:var(--muted);overflow-wrap:anywhere}
.ans.has{color:var(--ink)}
.gradeq{border-top:1px solid var(--line);padding-top:12px}
.gradeq:first-child{border-top:0;padding-top:0}
.grow{display:grid;grid-template-columns:minmax(0,10em) minmax(0,1fr) auto;gap:10px;align-items:center;padding:4px 0}
.filebtn{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:12px;background:var(--paper2);color:var(--ink);font-weight:600;cursor:pointer;position:relative}
.filebtn:hover{border-color:var(--gold)}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;min-height:0}
.thumb{display:block;max-width:220px;max-height:140px;border-radius:10px;margin-top:6px;object-fit:contain;background:#000}
#fxb[aria-pressed=false]{opacity:.7}
.pstat{font-size:13px;font-weight:600;text-align:right}
.script.probe.bad{border-left-color:var(--red)}
.script.probe.cur{box-shadow:0 0 0 2px var(--gold);opacity:1}
@media(max-width:600px){.grow{grid-template-columns:minmax(0,1fr) auto}.grow .ans{grid-column:1/-1;grid-row:2}}
</style>
</head>
<body>
<header class="top"><div class="row"><div class="row2" style="gap:14px"><div class="logo sm" role="img" aria-label="Kolties QuizKasten"><div class="in"><span class="l1">Kolties</span><span class="l2">QuizKasten</span></div></div><span class="sub">Moderation</span></div><div class="row2" id="topacts"></div></div></header>
<main class="wrap" id="app"><p class="hint">Wird geladen…</p></main>
<div class="toast" id="toast"></div>
<aside id="spotbox" hidden><div class="row2" style="justify-content:space-between;flex-wrap:nowrap"><b id="sptitle" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></b><button id="spclose" aria-label="Player ausblenden" style="min-height:32px;padding:0 10px">✕</button></div><div id="spframe"></div><p class="hint" id="spmsg"></p></aside>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script type="module" src="js/host.js?v=20261127i"></script>
<script>window.onSpotifyIframeApiReady = a => { window.SpotifyIframeApi = a; };</script>
<script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
</body>
</html>
